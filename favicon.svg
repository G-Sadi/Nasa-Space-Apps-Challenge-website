<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="satGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Emerald Green Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="#4ade80"/>
  <!-- Bold Dark FS Text -->
  <text x="32" y="43" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#04160b" text-anchor="middle" letter-spacing="-1.5">FS</text>
  <!-- Satellite Orbit Ring -->
  <circle cx="50" cy="14" r="6" fill="none" stroke="#04160b" stroke-width="1.2" opacity="0.3"/>
  <!-- Glowing White Satellite Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#ffffff" filter="url(#satGlow)"/>
</svg>
